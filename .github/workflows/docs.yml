name: CI controller regression validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 920039343247ac6497ac554290b7708b339f7bf6
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: python -m pip install pytest pytest-xdist pyyaml
    - run: python -m pytest tests/ut/tools/test_ci_control.py tests/ut/tools/test_ci_progress.py
        --confcutdir=tests/ut/tools -n 2 -q
