name: CI display browser proof
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Inspect the public PR display
        env:
          PROOF_PR: ${{ inputs.pr_number }}
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/lint/ci_status_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-display-browser-proof
          path: ci-display-proof/
