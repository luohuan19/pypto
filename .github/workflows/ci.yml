# Fork-only integration fixture for hw-native-sys/pypto#3382.
# Production controllers/publishers and the full-result job are copied unchanged.
# Only test execution is simulated; dispatch, GitHub tokens, run attempts,
# PR revision checks, and status writes use real GitHub Actions services.
# No self-hosted or device runner is used. The fork baseline is restored afterward.
name: CI
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != ''\n    && format('CI full PR #{0} @{1} base:{2}',\
  \ inputs.pr_number, inputs.head_sha, inputs.base_sha)\n    || github.event_name == 'pull_request'\n    && format('CI lint\
  \ PR #{0} @{1} base:{2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha)\n\
  \    || format('CI {0} {1}', github.event_name, github.ref_name) }}"
'on':
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (normally supplied by /ci full; empty tests main)
        type: string
        default: ''
      head_sha:
        description: Authorized PR head SHA
        type: string
        default: ''
      base_sha:
        description: Authorized PR base SHA
        type: string
        default: ''
      merge_sha:
        description: Immutable test merge SHA with base/head parents
        type: string
        default: ''
permissions:
  contents: read
cache-mode: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.pr_number && format('full-run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    if: github.repository == 'luohuan19/pypto'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      full: ${{ steps.target.outputs.full }}
      reuse_lint: ${{ steps.target.outputs.reuse_lint }}
      docs_changed: 'false'
      ptoas_version_changed: 'false'
      scenario: ${{ steps.scenario.outputs.mode }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.workflow_sha }}
        sparse-checkout: .github/scripts
        persist-credentials: false
    - name: Validate and pin the test revision
      id: target
      env:
        GH_TOKEN: ${{ github.token }}
      run: python .github/scripts/ci_control.py prepare
    - name: Select a deterministic hosted test case
      id: scenario
      env:
        GH_TOKEN: ${{ github.token }}
        TEST_HEAD: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
      run: "message=$(gh api \"repos/$GITHUB_REPOSITORY/commits/$TEST_HEAD\" --jq '.commit.message | split(\"\\n\")[0]')\n\
        case \"$message\" in\n  'test(ci): publication fail-once') mode=fail-once ;;\n  'test(ci): publication stale') mode=stale\
        \ ;;\n  *) mode=success ;;\nesac\necho \"mode=$mode\" >> \"$GITHUB_OUTPUT\"\n"
  toolchain:
    needs:
    - changes
    runs-on: ubuntu-latest
    steps:
    - run: echo "Hosted metadata fixture"
  pre-commit:
    needs:
    - changes
    if: needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo "Hosted lint fixture"
  clang-tidy:
    needs:
    - changes
    if: needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo "Hosted lint fixture"
  lint-gate:
    needs:
    - changes
    - pre-commit
    - clang-tidy
    if: always() && !cancelled() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - name: Require fresh or verified reusable lint
      env:
        REUSE_LINT: ${{ needs.changes.outputs.reuse_lint }}
        DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        PRE_COMMIT: ${{ needs.pre-commit.result }}
        CLANG_TIDY: ${{ needs.clang-tidy.result }}
      run: "if [ \"$REUSE_LINT\" = 'true' ]; then\n  # changes verified the exact prior PR/head/base lint run via GitHub.\n\
        \  test \"$PRE_COMMIT\" = 'skipped' && test \"$CLANG_TIDY\" = 'skipped'\nelse\n  test \"$PRE_COMMIT\" = 'success'\
        \ && {\n    test \"$CLANG_TIDY\" = 'success' || {\n      test \"$DOCS_ONLY\" = 'true' && test \"$CLANG_TIDY\" = 'skipped'\n\
        \    }\n  }\nfi\n"
  codegen-tests:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - run: echo "Hosted full-test fixture"
  dist-system-tests:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - run: echo "Hosted full-test fixture"
  docs-examples:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  examples-tests:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - run: echo "Hosted full-test fixture"
  onboard-tests-a5:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - run: echo "Hosted full-test fixture"
  prebuild-wheels:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  prebuild-wheels-github:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  pypto-lib-compile:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - run: echo "Hosted full-test fixture"
  pypto-lib-model:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - run: echo "Hosted full-test fixture"
  serving-guard:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  system-tests:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - run: echo "Hosted full-test fixture"
  system-tests-a5sim:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - run: echo "Hosted full-test fixture"
  system-tests-direct:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - run: echo "Hosted full-test fixture"
  unit-tests:
    needs:
    - changes
    - lint-gate
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - name: Exercise success, failure, and stale completion
      env:
        GH_TOKEN: ${{ github.token }}
        SCENARIO: ${{ needs.changes.outputs.scenario }}
        SOURCE_HEAD: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: "if [ \"$SCENARIO\" = fail-once ] && [ \"$GITHUB_RUN_ATTEMPT\" = 1 ]; then\n  echo \"Intentional first-attempt\
        \ failure for publication testing\" >&2\n  exit 1\nfi\nif [ \"$SCENARIO\" = stale ]; then\n  # Finish only after a\
        \ new PR head exists, so the original success is stale.\n  for poll in {1..60}; do\n    current=$(gh api \"repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER\"\
        \ --jq .head.sha)\n    if [ \"$current\" != \"$SOURCE_HEAD\" ]; then\n      echo \"A newer PR head exists; completing\
        \ the old test attempt\"\n      exit 0\n    fi\n    sleep 5\n  done\n  echo \"No head update arrived within five minutes\"\
        \ >&2\n  exit 1\nfi\necho \"Hosted full-test fixture passed\"\n"
    permissions:
      contents: read
      pull-requests: read
  full-result:
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.pr_number != ''
    needs:
      - changes
      - toolchain
      - pre-commit
      - clang-tidy
      - lint-gate
      - codegen-tests
      - dist-system-tests
      - docs-examples
      - examples-tests
      - onboard-tests-a5
      - prebuild-wheels
      - prebuild-wheels-github
      - pypto-lib-compile
      - pypto-lib-model
      - serving-guard
      - system-tests
      - system-tests-a5sim
      - system-tests-direct
      - unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # This fresh hosted job runs trusted control code only. Test jobs retain
      # read-only tokens; explicit dispatches also run after failed-job reruns.
      actions: write
    steps:
      - name: Checkout trusted result validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Require every applicable full test
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_control.py aggregate
      - name: Request full status publication
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run ci-full-status.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f run_id="$GITHUB_RUN_ID" -f wait_for_completion=true
      - name: Reconcile full job checks
        if: always()
        # Progress is informational; its dispatch cannot invalidate passing tests.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run ci-full-progress.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f run_id="$GITHUB_RUN_ID"
