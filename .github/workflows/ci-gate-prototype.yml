name: CI controller regression validation
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: a6be7e58b0d76adaaed78bce68e7c7e492826d62
        persist-credentials: false
    - run: python -m pip install pytest pytest-xdist pyyaml
    - run: python -m pytest tests/ut/tools/test_ci_control.py tests/ut/tools/test_ci_progress.py --confcutdir=tests/ut/tools
        -n 2 -q
